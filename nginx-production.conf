# /etc/nginx/conf.d/insights.vtrader.in.conf
# VTrader Stock Intelligence — insights.vtrader.in
# Frontend: static files from /home/vtrader/insights/frontend/dist
# Backend API: FastAPI on 127.0.0.1:8000

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name insights.vtrader.in;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name insights.vtrader.in;

    access_log /var/log/nginx/insights_access.log;
    error_log  /var/log/nginx/insights_error.log;

    # SSL (managed by Certbot — do not change)
    ssl_certificate     /etc/letsencrypt/live/insights.vtrader.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insights.vtrader.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Frontend — serve static build ──────────────────────────────
    root /home/vtrader/insights/frontend/dist;
    index index.html;

    # React SPA: all non-file routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Backend API — proxy to FastAPI ──────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Long timeout — AI analysis calls can take 60s+
        proxy_read_timeout    120s;
        proxy_connect_timeout  30s;
        proxy_send_timeout     120s;

        # Required for streaming / SSE if used later
        proxy_buffering off;
    }
}